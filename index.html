<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEO-KOWLOON · 程序化赛博朋克超级都市</title>
<style>
  :root{
    --neon-blue:#2f7bff; --neon-cyan:#20e6d6; --neon-purple:#a83cff;
    --neon-pink:#ff3fa4; --neon-red:#ff2a2a; --neon-amber:#ffc45a;
    --bg:#04060b; --panel:rgba(6,10,20,.72); --panel-2:rgba(9,14,26,.86);
    --line:rgba(90,190,255,.22); --line-hot:rgba(120,225,255,.55);
    --txt:#cfe6f5; --txt-dim:#7d93a8; --mono:"Cascadia Mono","Consolas","SF Mono",ui-monospace,monospace;
    --cjk:"Noto Sans SC","Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:var(--cjk);-webkit-font-smoothing:antialiased}
  canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* film grain + scanline overlay for the whole frame */
  #grade{position:fixed;inset:0;pointer-events:none;z-index:5;mix-blend-mode:overlay;opacity:.35;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px)}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:6;
    background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.62) 100%)}

  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;
    transition:opacity .25s ease}
  #hud.hidden{opacity:0}
  #hud>*{pointer-events:auto}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;
    backdrop-filter:blur(9px) saturate(1.3);-webkit-backdrop-filter:blur(9px) saturate(1.3);
    box-shadow:0 0 0 1px rgba(0,0,0,.5),0 8px 34px rgba(0,0,0,.55),inset 0 0 26px rgba(40,140,255,.06)}
  .panel::before{content:"";position:absolute;left:0;top:0;width:12px;height:12px;
    border-left:2px solid var(--neon-cyan);border-top:2px solid var(--neon-cyan);opacity:.75}
  .panel{position:absolute}

  /* ---------------- top bar ---------------- */
  .topbar{left:14px;top:14px;display:flex;gap:22px;align-items:stretch;padding:10px 16px 10px 18px;
    min-width:min(680px,52vw)}
  .brand-title{font-size:19px;font-weight:800;letter-spacing:.14em;
    background:linear-gradient(92deg,var(--neon-cyan),var(--neon-blue) 40%,var(--neon-purple) 70%,var(--neon-pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 22px rgba(70,190,255,.35)}
  .brand-sub{font-family:var(--mono);font-size:9.5px;color:var(--txt-dim);letter-spacing:.06em;margin-top:3px}
  .stats{display:grid;grid-template-columns:repeat(4,auto);gap:2px 20px;margin-left:auto;align-content:center}
  .stat{display:flex;gap:7px;align-items:baseline;font-family:var(--mono);font-size:10px}
  .stat-l{color:var(--txt-dim);letter-spacing:.1em}
  .stat-v{color:var(--neon-cyan);font-weight:700;min-width:52px}
  .stat-v.good{color:#5affc0}.stat-v.warn{color:var(--neon-amber)}.stat-v.bad{color:var(--neon-red)}
  .stat-v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}

  /* ---------------- minimap ---------------- */
  .minimap-panel{right:14px;top:14px;padding:8px;width:216px}
  .minimap{width:200px;height:200px;display:block;border:1px solid var(--line);
    background:#04060b;image-rendering:auto}
  .mm-legend{display:flex;flex-wrap:wrap;gap:4px 9px;margin-top:6px;font-size:9px;color:var(--txt-dim);
    font-family:var(--mono)}
  .mm-legend .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;
    vertical-align:middle;box-shadow:0 0 6px currentColor}

  /* ---------------- controls ---------------- */
  .controls{right:14px;top:250px;width:216px;padding:10px;max-height:calc(100vh - 300px);overflow:auto}
  .panel-title{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--line-hot);
    margin-bottom:8px;text-transform:uppercase}
  .panel-title.clickable{cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .group{margin-bottom:11px}
  .group-title{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--txt-dim);
    margin-bottom:5px}
  .row{display:flex;gap:5px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .chip, .btn{font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--txt-dim);
    background:rgba(12,18,32,.85);border:1px solid var(--line);border-radius:2px;
    padding:4px 8px;cursor:pointer;transition:.14s;white-space:nowrap}
  .chip:hover,.btn:hover{color:var(--txt);border-color:var(--line-hot);
    box-shadow:0 0 12px rgba(60,180,255,.28);background:rgba(20,32,54,.9)}
  .chip.on{color:#031018;background:linear-gradient(180deg,var(--neon-cyan),#1aa8c8);
    border-color:var(--neon-cyan);font-weight:700;box-shadow:0 0 16px rgba(32,230,214,.45)}
  .btn.primary{color:#12030a;background:linear-gradient(180deg,var(--neon-pink),#c41f7c);
    border-color:var(--neon-pink);font-weight:800;box-shadow:0 0 18px rgba(255,63,164,.4);flex:1}
  .btn.primary:hover{box-shadow:0 0 26px rgba(255,63,164,.7)}
  .btn.small{padding:3px 7px;font-size:9px}
  .btn.on{color:#031018;background:var(--neon-cyan);border-color:var(--neon-cyan);font-weight:700}
  .select,.input{font-family:var(--mono);font-size:10px;color:var(--txt);background:rgba(8,13,24,.95);
    border:1px solid var(--line);border-radius:2px;padding:4px 6px;flex:1;min-width:0;outline:none}
  .select:focus,.input:focus{border-color:var(--neon-cyan);box-shadow:0 0 10px rgba(32,230,214,.3)}
  .slider{flex:1;-webkit-appearance:none;appearance:none;height:3px;background:linear-gradient(90deg,var(--neon-purple),var(--neon-cyan));
    border-radius:2px;outline:none}
  .slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:var(--neon-cyan);box-shadow:0 0 12px var(--neon-cyan);cursor:pointer}
  .slider::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--neon-cyan);
    box-shadow:0 0 12px var(--neon-cyan);cursor:pointer}
  .mono{font-family:var(--mono);font-size:10px;color:var(--neon-cyan);min-width:38px;text-align:right}

  /* ---------------- report ---------------- */
  .report{left:14px;top:96px;width:min(430px,34vw);padding:10px 12px;max-height:44vh;overflow:auto}
  .report.collapsed .report-body{display:none}
  .verdict{font-family:var(--mono);font-size:10px;font-weight:800;padding:2px 8px;border-radius:2px}
  .verdict.pass{color:#04140d;background:#4dffa8}
  .verdict.concerns{color:#1a1200;background:var(--neon-amber)}
  .verdict.fail{color:#1a0006;background:var(--neon-red);color:#fff}
  .report-body{margin-top:8px;display:flex;flex-direction:column;gap:5px}
  .check{display:flex;gap:8px;align-items:flex-start;font-size:10.5px;line-height:1.35}
  .check-icon{font-size:11px;width:12px;flex:none;margin-top:1px}
  .check.ok .check-icon{color:#4dffa8;text-shadow:0 0 8px #4dffa8}
  .check.fail .check-icon{color:var(--neon-red);text-shadow:0 0 8px var(--neon-red)}
  .check-mid{flex:1;min-width:0}
  .check-label{color:var(--txt)}
  .check.fail .check-label{color:#ffb0bb}
  .check-detail{color:var(--txt-dim);font-family:var(--mono);font-size:8.5px;margin-top:1px}
  .check-val{font-family:var(--mono);font-size:9px;color:var(--neon-cyan);flex:none}
  .check-sum{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-size:9px;
    color:var(--txt-dim);font-family:var(--mono);line-height:1.6}
  .check-sum b{color:var(--neon-cyan)}

  /* ---------------- help ---------------- */
  .help{left:14px;bottom:14px;width:min(430px,34vw);padding:10px 12px}
  .help-grid{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 8px;font-size:10px;
    align-items:center}
  .help-grid kbd{font-family:var(--mono);font-size:9px;color:#031018;background:var(--neon-cyan);
    border-radius:2px;padding:2px 6px;font-weight:700;justify-self:start;box-shadow:0 0 10px rgba(32,230,214,.35)}
  .help-grid span{color:var(--txt-dim)}

  /* ---------------- loader ---------------- */
  .loader{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#0a1226 0%,#03050a 70%);transition:opacity .8s ease}
  .loader.gone{opacity:0;pointer-events:none}
  .loader-inner{width:min(560px,88vw)}
  .loader-title{font-size:clamp(26px,5vw,46px);font-weight:900;letter-spacing:.2em;text-align:center;
    background:linear-gradient(92deg,var(--neon-cyan),var(--neon-blue) 35%,var(--neon-purple) 68%,var(--neon-pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(70,190,255,.45))}
  .loader-sub{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
    color:var(--txt-dim);margin:8px 0 26px}
  .loader-steps{display:flex;flex-direction:column;gap:3px;margin-bottom:16px}
  .loader-step{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;
    font-family:var(--mono);font-size:10px;padding:3px 8px;border-left:2px solid rgba(90,190,255,.14);
    color:var(--txt-dim);transition:.3s}
  .loader-step.active{border-left-color:var(--neon-cyan);color:var(--txt);background:rgba(32,230,214,.06)}
  .loader-step.done{border-left-color:#4dffa8;color:#7fd8b4}
  .step-n{color:var(--line-hot)}
  .step-s{color:var(--neon-cyan);font-size:9px}
  .loader-step.done .step-s{color:#4dffa8}
  .loader-bar{height:3px;background:rgba(90,190,255,.14);border-radius:2px;overflow:hidden}
  .loader-fill{height:100%;width:0;background:linear-gradient(90deg,var(--neon-purple),var(--neon-cyan),var(--neon-pink));
    transition:width .35s ease;box-shadow:0 0 16px var(--neon-cyan)}
  .loader-status{font-family:var(--mono);font-size:9px;color:var(--txt-dim);margin-top:10px;
    text-align:center;letter-spacing:.08em}

  @media (max-width:1100px){
    .stats{grid-template-columns:repeat(2,auto)}
    .report{max-height:32vh}
    .help{display:none}
  }

  /* ---------------- fatal: no usable WebGL ---------------- */
  #fatal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#160a12 0%,#04050a 70%);padding:24px}
  #fatal[hidden]{display:none}
  .fatal-inner{max-width:640px;background:var(--panel-2);border:1px solid var(--neon-red);
    border-radius:3px;padding:22px 26px;box-shadow:0 0 40px rgba(255,42,42,.25)}
  .fatal-title{font-size:18px;font-weight:800;letter-spacing:.1em;color:#ff8f9b;margin-bottom:12px}
  .fatal-inner p{font-size:12.5px;line-height:1.75;color:var(--txt);margin-bottom:12px}
  .fatal-inner ul{margin:0 0 14px 18px;font-size:12px;line-height:1.85;color:var(--txt-dim)}
  .fatal-inner code{font-family:var(--mono);font-size:11px;color:var(--neon-cyan);
    background:rgba(32,230,214,.08);padding:1px 5px;border-radius:2px}
  .fatal-diag{font-family:var(--mono);font-size:10px;color:var(--txt-dim);
    border-top:1px solid var(--line);padding-top:10px;word-break:break-all}

  /* ---------------- toast ---------------- */
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:150;
    max-width:min(760px,86vw);background:var(--panel-2);border:1px solid var(--neon-amber);
    border-left-width:3px;border-radius:3px;padding:11px 16px;font-size:12px;line-height:1.65;
    color:var(--txt);box-shadow:0 8px 30px rgba(0,0,0,.6);opacity:0;pointer-events:none;
    transition:opacity .35s ease, transform .35s ease}
  #toast.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(-6px)}
  #toast b{color:var(--neon-amber)}
  #toast .toast-x{float:right;margin-left:14px;cursor:pointer;color:var(--txt-dim);font-family:var(--mono)}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="grade"></div>
<div id="vignette"></div>
<div id="hud"></div>

<div id="fatal" hidden>
  <div class="fatal-inner">
    <div class="fatal-title">无法启动 · CANNOT START</div>
    <p id="fatal-msg">这台设备没有可用的 WebGL。</p>
    <p>这是一个实时 3D 程序化城市，需要浏览器开启硬件加速的 WebGL 支持。可以尝试：</p>
    <ul>
      <li>换用较新的 <b>Chrome / Edge / Firefox</b>（桌面版，建议 110 以上）</li>
      <li>Chrome / Edge：<code>设置 → 系统 → 使用硬件加速</code>（或 <code>chrome://gpu</code> 查看状态）并重启浏览器</li>
      <li>确认没有在无 GPU 的虚拟机 / 远程桌面中运行，且显卡驱动为最新</li>
      <li>Firefox：<code>about:config → webgl.force-enabled = true</code></li>
    </ul>
    <div class="fatal-diag" id="fatal-diag"></div>
  </div>
</div>

<div id="toast"><span class="toast-x" onclick="this.parentNode.classList.remove('on')">✕</span><span id="toast-msg"></span></div>
