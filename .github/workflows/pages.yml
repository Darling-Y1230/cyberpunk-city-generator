name: Deploy demo to GitHub Pages

# Publishes the generated single-file city as the site root, so the repository
# has a live, indexable URL that anyone can open without cloning anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch dependencies
        run: node tools/fetch-deps.mjs

      # Built from source rather than copying the committed artefact, so the
      # live demo always reflects the current main branch.
      - name: Build
        run: node tools/build.mjs

      - name: Assemble site
        run: |
          mkdir -p _site
          cp dist/cyberpunk-city.html _site/index.html
          cp dist/cyberpunk-city.html _site/cyberpunk-city.html
          cp -r docs/img _site/img 2>/dev/null || true
          ls -lh _site

      # enablement: true lets this step turn Pages on itself, via the workflow's
      # pages: write permission. Without it the step fails with "Get Pages site
      # failed: Not Found" on any repository where nobody has opened
      # Settings -> Pages yet, which is exactly the state of a freshly created
      # repository — so the first deploy would always fail until someone did it.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
