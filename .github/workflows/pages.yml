name: Deploy demo to GitHub Pages

# Publishes the generated single-file city as the site root, so the repository
# has a live, indexable URL that anyone can open without cloning anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch dependencies
        run: node tools/fetch-deps.mjs

      # Built from source rather than copying the committed artefact, so the
      # live demo always reflects the current main branch.
      - name: Build
        run: node tools/build.mjs

      - name: Assemble site
        run: |
          mkdir -p _site
          cp dist/cyberpunk-city.html _site/index.html
          cp dist/cyberpunk-city.html _site/cyberpunk-city.html
          cp -r docs/img _site/img 2>/dev/null || true
          ls -lh _site

      # enablement: true asks this step to turn Pages on itself, using the
      # workflow's pages: write permission. It is the documented way to make a
      # fresh repository deploy without anyone opening Settings first.
      #
      # NOTE: on this repository it did NOT succeed — the run still fails here
      # with the Pages API returning 404, and the step logs need authentication
      # to read. Two settings are worth checking if the deploy keeps failing:
      #   Settings -> Pages -> Source: GitHub Actions
      #   Settings -> Actions -> General -> Workflow permissions
      #                              (must not be read-only, or a workflow
      #                               cannot grant itself pages: write)
      # Everything before this step passes: checkout, fetch, build, assemble.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
